<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ISBN scan test</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #8cf; }
  video { width: 100%; max-height: 40vh; background: #000; border-radius: 8px; object-fit: cover; }
  button { font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: #2a7; color: #fff; margin: 4px 4px 4px 0; }
  input { font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; width: 60%; }
  pre { background: #222; padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .ok { color: #6e6; } .ng { color: #f66; }
</style>
</head>
<body>
<h2>1. カメラ読み取り(ZXing)</h2>
<video id="v" playsinline muted></video>
<div>
  <button id="start">カメラ開始</button>
  <button id="stop">停止</button>
</div>
<pre id="scanLog">待機中</pre>

<h2>2. NDLサーチ CORS確認</h2>
<input id="isbn" inputmode="numeric" value="9784003101018" placeholder="ISBN13">
<button id="fetchBtn">取得</button>
<pre id="ndlLog">未実行</pre>

<h2>環境</h2>
<pre id="env"></pre>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = (el, msg, cls) => { $(el).innerHTML = (cls ? `<span class="${cls}">` : '') + msg + (cls ? '</span>' : ''); };

// 環境表示(ホーム画面追加で起動しているか)
$('env').textContent = [
  'standalone: ' + (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches),
  'BarcodeDetector: ' + ('BarcodeDetector' in window),
  'mediaDevices: ' + !!navigator.mediaDevices,
  'UA: ' + navigator.userAgent
].join('\n');

// --- カメラ ---
let reader = null;
const isIsbn = s => /^97[89]\d{10}$/.test(s);

$('start').onclick = async () => {
  try {
    const { BrowserMultiFormatReader, DecodeHintType, BarcodeFormat } = ZXing;
    const hints = new Map();
    hints.set(DecodeHintType.POSSIBLE_FORMATS, [BarcodeFormat.EAN_13]);
    hints.set(DecodeHintType.TRY_HARDER, true);
    reader = new BrowserMultiFormatReader(hints);
    log('scanLog', 'カメラ起動中...');
    await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      'v',
      (result, err) => {
        if (result) {
          const t = result.getText();
          if (isIsbn(t)) {
            log('scanLog', 'ISBN検出: ' + t, 'ok');
            $('isbn').value = t;
          } else {
            log('scanLog', '検出(ISBNではない・2段目の可能性): ' + t);
          }
        }
      }
    );
    log('scanLog', '起動OK。本の裏の「978」始まりのバーコードに向けてね', 'ok');
  } catch (e) {
    log('scanLog', 'エラー: ' + e.name + ' / ' + e.message, 'ng');
  }
};
$('stop').onclick = () => { if (reader) reader.reset(); log('scanLog', '停止'); };

// --- NDL CORS ---
$('fetchBtn').onclick = async () => {
  const isbn = $('isbn').value.trim();
  const url = 'https://ndlsearch.ndl.go.jp/api/opensearch?isbn=' + encodeURIComponent(isbn);
  log('ndlLog', '取得中...');
  try {
    const res = await fetch(url);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    const items = doc.getElementsByTagName('item');
    const first = items[0];
    const subjects = first ? [...first.getElementsByTagName('dc:subject')].map(n =>
      (n.getAttribute('xsi:type') || '(型なし)') + ' = ' + n.textContent) : [];
    const title = first && first.getElementsByTagName('title')[0]?.textContent;
    log('ndlLog',
      `CORS OK / HTTP ${res.status} / ヒット ${items.length}件\n` +
      `title: ${title}\n` + (subjects.join('\n') || 'subject なし(NDCなし)') +
      `\n\n--- 先頭500文字 ---\n` + text.slice(0, 500).replace(/</g, '&lt;'),
      'ok');
  } catch (e) {
    log('ndlLog', '失敗: ' + e.name + ' / ' + e.message + '\n→ CORSで弾かれた可能性大。中継が必要', 'ng');
  }
};
</script>
</body>
</html>
